trigger: none
pr: none

parameters:
  - name: githubReleaseCommit
    displayName: Full GitHub release commit (deploy only)
    type: string
    default: ''
  - name: azureDevOpsEnvironment
    displayName: Azure DevOps environment name
    type: string
    default: teamsapp-canary
  - name: azureDevOpsEnvironmentId
    displayName: Azure DevOps environment resource ID with an approval check
    type: string
    default: ''
  - name: rollback
    displayName: Roll back the current traffic-serving revision
    type: boolean
    default: false
  - name: codexPackageUrl
    displayName: Approved HTTPS URL of the official Linux Codex package
    type: string
    default: ''
  - name: codexPackageSha256
    displayName: Approved SHA-256 of the official Linux Codex package
    type: string
    default: ''
  - name: codexPackageVersion
    displayName: Expected version of the official Linux Codex package
    type: string
    default: ''

variables:
  azureServiceConnection: teamsapp-azure-canary
  azureSubscriptionId: 0e58c3cb-474d-4e70-978a-4939c586f867
  azureResourceGroup: rg-teamsapp-canary
  azureLocation: koreacentral
  azureWorkloadName: teamsapp
  githubRepository: devdoo-teams/teams-app
  allowedGitHubRepositories: devdoo-teams/teams-app
  # These values are supplied as Azure DevOps pipeline variables (or a linked
  # variable group). Secret contents never enter this file or the ARM params.
  # The two *_KEY_VAULT_SECRET_NAME values are only secret names.

stages:
  - stage: ValidateHandoff
    displayName: Verify authenticated and attested GitHub handoff
    condition: and(succeeded(), eq(${{ parameters.rollback }}, false))
    jobs:
      - job: ValidateReleaseArtifact
        displayName: Resolve the release artifact by repository and commit
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
          - bash: |
              set -Eeuo pipefail
              handoff_failure_dir="$(Pipeline.Workspace)/github-handoff-failure"
              handoff_failure="$handoff_failure_dir/github-handoff-failure-receipt.json"
              handoff_boundary="bootstrap"
              mkdir -p "$handoff_failure_dir"
              write_failure_receipt() {
                local status="$1"
                (
                  set +e
                  node scripts/azure-deployment-failure-receipt.mjs \
                    --output "$handoff_failure" \
                    --stage "ValidateHandoff" \
                    --job "ValidateReleaseArtifact" \
                    --boundary "${handoff_boundary:-bootstrap}" \
                    --exit-code "$status" \
                    --source-commit "${GITHUB_RELEASE_COMMIT:-unknown}" \
                    --pipeline-run-id "${BUILD_BUILDID:-unknown}" >/dev/null 2>&1
                  printf '##vso[task.logissue type=error;code=TEAMSAPP_GITHUB_HANDOFF_BOUNDARY;]boundary=%s exitCode=%s; inspect github-handoff-failure-receipt artifact and this task stderr.\n' "${handoff_boundary:-bootstrap}" "$status"
                ) || true
              }
              trap 'status=$?; write_failure_receipt "$status"; exit "$status"' ERR
              test -n "$GITHUB_RELEASE_COMMIT"
              handoff_boundary="github-container-registry-auth"
              printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ARTIFACT_USERNAME" --password-stdin
              handoff_boundary="release-artifact-handoff"
              node scripts/azure-github-handoff.mjs "$GITHUB_REPOSITORY" "$GITHUB_RELEASE_COMMIT" "$(Pipeline.Workspace)/github-handoff"
            displayName: Download, digest-check, extract, and attest GitHub artifact
            env:
              AZURE_RELEASE_ALLOWED_REPOSITORIES: $(allowedGitHubRepositories)
              GITHUB_ARTIFACT_USERNAME: $(githubArtifactUsername)
              GITHUB_RELEASE_COMMIT: ${{ parameters.githubReleaseCommit }}
              GITHUB_REPOSITORY: $(githubRepository)
              GITHUB_TOKEN: $(githubArtifactReadToken)
          - task: PublishPipelineArtifact@1
            displayName: Retain bounded GitHub handoff failure receipt
            condition: failed()
            inputs:
              targetPath: $(Pipeline.Workspace)/github-handoff-failure
              artifact: github-handoff-failure-receipt
          - task: PublishPipelineArtifact@1
            displayName: Retain verified GitHub handoff and provenance
            inputs:
              targetPath: $(Pipeline.Workspace)/github-handoff
              artifact: validated-github-handoff

  - stage: ValidateApprovalConfiguration
    displayName: Verify external Azure DevOps approval configuration
    dependsOn: []
    jobs:
      - job: VerifyEnvironmentApproval
        displayName: Query enabled approval check for the exact environment
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              test -n "$AZURE_DEVOPS_ENVIRONMENT_ID"
              node scripts/azure-approval-check.mjs \
                "$SYSTEM_COLLECTION_URI" \
                "$SYSTEM_TEAM_PROJECT" \
                "$AZURE_DEVOPS_ENVIRONMENT_ID" \
                "$AZURE_DEVOPS_ENVIRONMENT_NAME" \
                "$(Pipeline.Workspace)/approval-preflight/approval-check-receipt.json"
            displayName: Fail closed unless an operator approval check exists
            env:
              AZURE_DEVOPS_ENVIRONMENT_ID: ${{ parameters.azureDevOpsEnvironmentId }}
              AZURE_DEVOPS_ENVIRONMENT_NAME: ${{ parameters.azureDevOpsEnvironment }}
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_COLLECTION_URI: $(System.CollectionUri)
              SYSTEM_TEAM_PROJECT: $(System.TeamProject)
          - task: PublishPipelineArtifact@1
            displayName: Retain approval configuration receipt
            inputs:
              targetPath: $(Pipeline.Workspace)/approval-preflight
              artifact: approval-configuration-receipt

  - stage: ValidateAzurePlatform
    displayName: Verify Azure Core and RBAC before environment approval
    dependsOn:
      - ValidateHandoff
    condition: and(succeeded(), eq(${{ parameters.rollback }}, false))
    jobs:
      - job: ValidatePinnedLinuxRuntime
        displayName: Run the complete Azure gate on the pinned deployment OS
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
          - download: current
            artifact: validated-github-handoff
          - task: UseNode@1
            displayName: Install the pinned worker Node runtime
            inputs:
              version: 24.19.0
          - bash: |
              set -euo pipefail
              node scripts/azure-production-runtime-config.mjs
            displayName: Validate production Teams identity and Key Vault reference contract
            env:
              TEAMS_APP_ID: $(TEAMS_APP_ID)
              TEAMS_CATALOG_APP_ID: $(TEAMS_CATALOG_APP_ID)
              BOT_ID: $(BOT_ID)
              TAB_DOMAIN: $(TAB_DOMAIN)
              CLIENT_ID: $(CLIENT_ID)
              BOT_CLIENT_ID: $(BOT_CLIENT_ID)
              TENANT_ID: $(TENANT_ID)
              APPLICATION_ID_URI: $(APPLICATION_ID_URI)
              TEAMS_USER_AUTH_ACCEPTED_AUDIENCES: $(TEAMS_USER_AUTH_ACCEPTED_AUDIENCES)
              TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME: $(TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME)
              TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME: $(TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME)
          - bash: |
              set -euo pipefail
              platform_dir="$(Pipeline.Workspace)/azure-platform-preflight"
              worker_package_dir="$(Pipeline.Workspace)/azure-worker-runtime-package"
              mkdir -p "$platform_dir" "$(Pipeline.Workspace)/azure-rbac-preflight"
              [[ "$CODEX_PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]
              [[ "$CODEX_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              expected_codex_package_url="https://github.com/openai/codex/releases/download/rust-v${CODEX_PACKAGE_VERSION}/codex-package-x86_64-unknown-linux-musl.tar.gz"
              test "$CODEX_PACKAGE_URL" = "$expected_codex_package_url"
              release_receipt="$(Pipeline.Workspace)/validated-github-handoff/dist/evidence/azure-release-receipt.json"
              pipeline_source_commit="$(git rev-parse HEAD)"
              commit="$(jq -er '.commit' "$release_receipt")"
              git fetch --no-tags origin "$commit" --depth=1
              git checkout --detach "$commit"
              test "$(git rev-parse HEAD)" = "$commit"
              test -z "$(git status --porcelain=v1 --untracked-files=no)"
              pinned_node_bin="$(command -v node)"
              test -x "$pinned_node_bin"
              test "$("$pinned_node_bin" --version)" = 'v24.19.0'
              node scripts/azure-release-input.mjs "$release_receipt"
              npm ci --ignore-scripts --no-audit --no-fund
              az --version
              az bicep version
              if command -v bicep >/dev/null 2>&1; then
                export BICEP_BIN="$(command -v bicep)"
              else
                bicep_config_dir="${AZURE_CONFIG_DIR:-$HOME/.azure}"
                export BICEP_BIN="${bicep_config_dir}/bin/bicep"
              fi
              test -x "$BICEP_BIN"
              export PATH="$PATH:$(dirname "$BICEP_BIN")"
              bicep_version="$("$BICEP_BIN" --version)"
              tar_version="$(tar --version | sed -n '1p')"
              ruby_version="$(ruby --version)"
              psych_version="$(ruby -rpsych -e 'print Psych::VERSION')"
              python_version="$(python3 --version 2>&1)"
              printf '%s\n' "$bicep_version" "$tar_version" "$ruby_version" "Psych $psych_version" "$python_version"
              export TEAMS_SOURCE_COMMIT="$commit"
              npm run test:azure-core
              npm run build:worker
              codex_package_archive="$(Agent.TempDirectory)/codex-package-x86_64-unknown-linux-musl.tar.gz"
              codex_package_receipt="$(Agent.TempDirectory)/codex-package-receipt.json"
              codex_runtime="$(Agent.TempDirectory)/codex-runtime"
              rm -rf "$codex_runtime" "$worker_package_dir"
              curl --proto '=https' --tlsv1.2 --fail --location --retry 4 --retry-all-errors --connect-timeout 15 --max-time 300 --output "$codex_package_archive" "$CODEX_PACKAGE_URL"
              node scripts/azure-codex-package.mjs \
                --archive "$codex_package_archive" \
                --archive-sha256 "$CODEX_PACKAGE_SHA256" \
                --expected-version "$CODEX_PACKAGE_VERSION" \
                --output "$codex_runtime" > "$codex_package_receipt"
              node scripts/azure-worker-runtime-package.mjs build \
                --worker-dist dist/worker \
                --node-bin "$pinned_node_bin" \
                --codex-runtime "$codex_runtime" \
                --codex-receipt "$codex_package_receipt" \
                --codex-package-sha256 "$CODEX_PACKAGE_SHA256" \
                --codex-version "$CODEX_PACKAGE_VERSION" \
                --commit "$commit" \
                --installer infra/azure/scripts/install-worker-runtime.sh \
                --validator infra/azure/scripts/validate-worker-runtime-manifest.mjs \
                --expected-node-version 24.19.0 \
                --output-dir "$worker_package_dir" > "$(Agent.TempDirectory)/worker-runtime-build-receipt.json"
              worker_receipt="$worker_package_dir/worker-runtime-receipt.json"
              worker_archive="$worker_package_dir/worker-runtime-${commit}.tar"
              node scripts/azure-worker-runtime-package.mjs verify \
                --archive "$worker_archive" \
                --receipt "$worker_receipt" \
                --commit "$commit" \
                --codex-package-sha256 "$CODEX_PACKAGE_SHA256" \
                --codex-version "$CODEX_PACKAGE_VERSION" \
                --expected-node-version 24.19.0 > "$(Agent.TempDirectory)/worker-runtime-verify-receipt.json"
              worker_archive_sha="$(jq -er '.archiveSha256' "$worker_receipt")"
              codex_bin_sha="$(jq -er '.codexBinSha256' "$worker_receipt")"
              # The next task runs in this same checkout. Restore the pipeline
              # source so deployment helpers and Bicep match the YAML run,
              # while the worker artifact remains bound to the attested release.
              git checkout --detach "$pipeline_source_commit"
              test "$(git rev-parse HEAD)" = "$pipeline_source_commit"
              test -z "$(git status --porcelain=v1 --untracked-files=no)"
              jq -n \
                --arg sourceCommit "$commit" \
                --arg runnerImage "ubuntu-24.04" \
                --arg nodeVersion "$("$pinned_node_bin" --version)" \
                --arg bicepVersion "$bicep_version" \
                --arg tarVersion "$tar_version" \
                --arg rubyVersion "$ruby_version" \
                --arg psychVersion "$psych_version" \
                --arg pythonVersion "$python_version" \
                --arg workerRuntimeArchiveSha256 "$worker_archive_sha" \
                --arg codexPackageVersion "$CODEX_PACKAGE_VERSION" \
                --arg codexPackageSha256 "$CODEX_PACKAGE_SHA256" \
                --arg codexBinSha256 "$codex_bin_sha" \
                '{schemaVersion:1,kind:"azure-platform-preflight",status:"READY",sourceCommit:$sourceCommit,runnerImage:$runnerImage,nodeVersion:$nodeVersion,bicepVersion:$bicepVersion,tarVersion:$tarVersion,rubyVersion:$rubyVersion,psychVersion:$psychVersion,pythonVersion:$pythonVersion,azureCorePassed:true,workerBuildPassed:true,workerRuntimePackaged:true,workerRuntimeArchiveSha256:$workerRuntimeArchiveSha256,codexPackageVersion:$codexPackageVersion,codexPackageSha256:$codexPackageSha256,codexBinSha256:$codexBinSha256}' \
                > "$platform_dir/azure-platform-preflight-receipt.json"
            displayName: Test exact source with hosted Bicep, GNU tar, Ruby, and Python
            env:
              CODEX_PACKAGE_URL: ${{ parameters.codexPackageUrl }}
              CODEX_PACKAGE_SHA256: ${{ parameters.codexPackageSha256 }}
              CODEX_PACKAGE_VERSION: ${{ parameters.codexPackageVersion }}
          - task: AzureCLI@2
            displayName: Verify caller-effective Azure RBAC and foundation what-if before approval
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                test "$(az account show --query id --output tsv)" = "$AZURE_SUBSCRIPTION_ID"
                test -n "$WORKER_ADMIN_SSH_PUBLIC_KEY"
                rbac_receipt_dir="$(Pipeline.Workspace)/azure-rbac-preflight"
                what_if_receipt_dir="$(Pipeline.Workspace)/azure-what-if-preflight"
                permissions="$(Agent.TempDirectory)/azure-rbac-permissions.json"
                foundation_parameters="$(Agent.TempDirectory)/foundation-preflight.parameters.json"
                foundation_what_if="$(Agent.TempDirectory)/foundation-preflight.what-if.json"
                mkdir -p "$rbac_receipt_dir" "$what_if_receipt_dir"
                trap 'rm -f "$permissions" "$foundation_parameters" "$foundation_what_if"' EXIT
                az rest \
                  --method get \
                  --url "https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourcegroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" \
                  --only-show-errors \
                  --output json > "$permissions"
                node scripts/azure-deployment-rbac.mjs \
                  "$permissions" \
                  "$rbac_receipt_dir/azure-deployment-rbac-receipt.json"

                release_receipt="$(Pipeline.Workspace)/validated-github-handoff/dist/evidence/azure-release-receipt.json"
                node scripts/azure-release-input.mjs "$release_receipt"
                commit="$(jq -er '.commit' "$release_receipt")"
                git fetch --no-tags origin "$commit" --depth=1
                git checkout --detach "$commit"
                version="$(jq -er '.version' "$release_receipt")"
                source_image="$(jq -er '.image' "$release_receipt")"
                source_digest="$(jq -er '.imageDigest' "$release_receipt")"
                deployment_principal_id="$(
                  az account get-access-token --resource-type arm --subscription "$AZURE_SUBSCRIPTION_ID" --query accessToken --output tsv |
                    node scripts/azure-access-token-principal.mjs --expected-tenant "$tenantId" --expected-client "$servicePrincipalId"
                )"
                test "$(git rev-parse HEAD)" = "$commit"
                test -z "$(git status --porcelain=v1 --untracked-files=no)"
                az --version
                az bicep version
                if command -v bicep >/dev/null 2>&1; then
                  export BICEP_BIN="$(command -v bicep)"
                else
                  bicep_config_dir="${AZURE_CONFIG_DIR:-$HOME/.azure}"
                  export BICEP_BIN="${bicep_config_dir}/bin/bicep"
                fi
                test -x "$BICEP_BIN"
                export PATH="$PATH:$(dirname "$BICEP_BIN")"
                "$BICEP_BIN" --version
                set +e
                parameter_output="$(node scripts/azure-deployment-parameters.mjs \
                  --phase foundation \
                  --release-receipt "$release_receipt" \
                  --workload-name "$AZURE_WORKLOAD_NAME" \
                  --location "$AZURE_LOCATION" \
                  --container-image "${source_image}@${source_digest}" \
                  --deployment-principal-id "$deployment_principal_id" \
                  --worker-admin-ssh-public-key "$WORKER_ADMIN_SSH_PUBLIC_KEY" \
                  --teams-app-id "$TEAMS_APP_ID" \
                  --teams-catalog-app-id "$TEAMS_CATALOG_APP_ID" \
                  --bot-id "$BOT_ID" \
                  --tab-domain "$TAB_DOMAIN" \
                  --client-id "$CLIENT_ID" \
                  --bot-client-id "$BOT_CLIENT_ID" \
                  --tenant-id "$TENANT_ID" \
                  --application-id-uri "$APPLICATION_ID_URI" \
                  --teams-user-auth-accepted-audiences "$TEAMS_USER_AUTH_ACCEPTED_AUDIENCES" \
                  --bot-client-secret-key-vault-secret-name "$TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME" \
                  --operator-allowlist-key-vault-secret-name "$TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME" \
                  --output "$foundation_parameters" 2>&1)"
                parameter_status=$?
                set -e
                if [ "$parameter_status" -ne 0 ]; then
                  printf '%s\n' "Azure foundation deployment parameter generation failed (status ${parameter_status})." >&2
                  printf '%s\n' "$parameter_output" \
                    | sed -E 's/(password|secret|token|authorization|bearer)[^[:space:]]*/\1=[REDACTED]/Ig' >&2
                  exit "$parameter_status"
                fi
                printf '%s\n' "$parameter_output"
                test -s "$foundation_parameters"
                az deployment group what-if \
                  --name teamsapp-platform-foundation-preflight \
                  --subscription "$AZURE_SUBSCRIPTION_ID" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --template-file infra/azure/main.bicep \
                  --parameters "@${foundation_parameters}" \
                  --mode Incremental \
                  --result-format FullResourcePayloads \
                  --no-pretty-print \
                  --no-prompt true \
                  --validation-level Provider \
                  --only-show-errors \
                  --output json > "$foundation_what_if"
                node scripts/azure-what-if-receipt.mjs diagnose \
                  --what-if "$foundation_what_if" \
                  --phase foundation \
                  --commit "$commit" \
                  --version "$version" \
                  --subscription "$AZURE_SUBSCRIPTION_ID" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --template infra/azure/main.bicep \
                  --parameters "$foundation_parameters" \
                  --output "$what_if_receipt_dir/azure-what-if-preflight-diagnostic.json"
                node scripts/azure-what-if-receipt.mjs create \
                  --what-if "$foundation_what_if" \
                  --phase foundation \
                  --commit "$commit" \
                  --version "$version" \
                  --subscription "$AZURE_SUBSCRIPTION_ID" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --template infra/azure/main.bicep \
                  --parameters "$foundation_parameters" \
                  --output "$what_if_receipt_dir/azure-what-if-preflight-receipt.json"
            env:
              AZURE_LOCATION: $(azureLocation)
              AZURE_RESOURCE_GROUP: $(azureResourceGroup)
              AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
              AZURE_WORKLOAD_NAME: $(azureWorkloadName)
              WORKER_ADMIN_SSH_PUBLIC_KEY: $(workerAdminSshPublicKey)
              TEAMS_APP_ID: $(TEAMS_APP_ID)
              TEAMS_CATALOG_APP_ID: $(TEAMS_CATALOG_APP_ID)
              BOT_ID: $(BOT_ID)
              TAB_DOMAIN: $(TAB_DOMAIN)
              CLIENT_ID: $(CLIENT_ID)
              BOT_CLIENT_ID: $(BOT_CLIENT_ID)
              TENANT_ID: $(TENANT_ID)
              APPLICATION_ID_URI: $(APPLICATION_ID_URI)
              TEAMS_USER_AUTH_ACCEPTED_AUDIENCES: $(TEAMS_USER_AUTH_ACCEPTED_AUDIENCES)
              TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME: $(TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME)
              TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME: $(TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME)
          - task: PublishPipelineArtifact@1
            displayName: Retain pre-approval Azure platform receipt
            inputs:
              targetPath: $(Pipeline.Workspace)/azure-platform-preflight
              artifact: azure-platform-preflight-receipt
          - task: PublishPipelineArtifact@1
            displayName: Retain immutable pre-approval worker runtime package
            inputs:
              targetPath: $(Pipeline.Workspace)/azure-worker-runtime-package
              artifact: azure-worker-runtime-package
          - task: PublishPipelineArtifact@1
            displayName: Retain pre-approval caller-effective RBAC receipt
            condition: always()
            inputs:
              targetPath: $(Pipeline.Workspace)/azure-rbac-preflight
              artifact: azure-rbac-preflight-receipt
          - task: PublishPipelineArtifact@1
            displayName: Retain exact pre-approval foundation what-if receipt
            condition: always()
            inputs:
              targetPath: $(Pipeline.Workspace)/azure-what-if-preflight
              artifact: azure-what-if-preflight-receipt

  - stage: DeployCanary
    displayName: Provision and deploy immutable canary revision
    dependsOn:
      - ValidateHandoff
      - ValidateApprovalConfiguration
      - ValidateAzurePlatform
    condition: and(succeeded(), eq(${{ parameters.rollback }}, false))
    jobs:
      - deployment: DeployCanaryRevision
        displayName: Deploy main.bicep with the verified release identity
        pool:
          vmImage: ubuntu-24.04
        environment: ${{ parameters.azureDevOpsEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: validated-github-handoff
                - download: current
                  artifact: approval-configuration-receipt
                - download: current
                  artifact: azure-platform-preflight-receipt
                - download: current
                  artifact: azure-rbac-preflight-receipt
                - download: current
                  artifact: azure-worker-runtime-package
                - download: current
                  artifact: azure-what-if-preflight-receipt
                - task: UseNode@1
                  displayName: Install the pinned worker Node runtime
                  inputs:
                    version: 24.19.0
                - task: AzureCLI@2
                  displayName: Provision from Bicep outputs, import digest, deploy, and verify
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -Eeuo pipefail
                      failure_receipt_dir="$(Pipeline.Workspace)/azure-deployment-failure"
                      failure_receipt="$failure_receipt_dir/azure-deployment-failure-receipt.json"
                      failure_receipt_sha256="$failure_receipt_dir/azure-deployment-failure-receipt.sha256"
                      failure_receipt_script="$(Agent.TempDirectory)/azure-deployment-failure-receipt.mjs"
                      what_if_receipt_tools_dir="$(Agent.TempDirectory)/azure-what-if-receipt-tools"
                      what_if_receipt_script="$what_if_receipt_tools_dir/azure-what-if-receipt.mjs"
                      deployment_contract_script="$what_if_receipt_tools_dir/azure-deployment-contract.mjs"
                      worker_runtime_probe_script="$(Agent.TempDirectory)/azure-worker-runtime-probe.mjs"
                      worker_runtime_probe_response="$(Agent.TempDirectory)/azure-worker-runtime-probe-response.json"
                      worker_runtime_probe_dir="$(Pipeline.Workspace)/azure-worker-runtime-probe"
                      failure_boundary="bootstrap"
                      worker_blob_script="$(Agent.TempDirectory)/azure-worker-blob-stage.mjs"
                      foundation_parameters="$(Agent.TempDirectory)/foundation.parameters.json"
                      workload_parameters="$(Agent.TempDirectory)/workload.parameters.json"
                      workload_what_if="$(Agent.TempDirectory)/workload.what-if.json"
                      worker_vm_inventory="$(Agent.TempDirectory)/worker-vm-inventory.json"
                      mkdir -p "$failure_receipt_dir"
                      mkdir -p "$what_if_receipt_tools_dir"
                      mkdir -p "$worker_runtime_probe_dir"
                      cp scripts/azure-deployment-failure-receipt.mjs "$failure_receipt_script"
                      cp scripts/azure-worker-blob-stage.mjs "$worker_blob_script"
                      cp scripts/azure-worker-runtime-probe.mjs "$worker_runtime_probe_script"
                      cp scripts/azure-what-if-receipt.mjs "$what_if_receipt_tools_dir/azure-what-if-receipt.mjs"
                      cp scripts/azure-deployment-contract.mjs "$deployment_contract_script"
                      cp scripts/azure-release-input.mjs "$what_if_receipt_tools_dir/azure-release-input.mjs"
                      cp scripts/azure-canary-preflight.mjs "$what_if_receipt_tools_dir/azure-canary-preflight.mjs"
                      cp scripts/core-test-runner.mjs "$what_if_receipt_tools_dir/core-test-runner.mjs"
                      cp scripts/core-test-workspace.mjs "$what_if_receipt_tools_dir/core-test-workspace.mjs"
                      cp scripts/fileprovider-git-clean.mjs "$what_if_receipt_tools_dir/fileprovider-git-clean.mjs"
                      cp scripts/child-test-environment.mjs "$what_if_receipt_tools_dir/child-test-environment.mjs"
                      test -s "$failure_receipt_script"
                      test -s "$worker_blob_script"
                      test -s "$worker_runtime_probe_script"
                      test -s "$what_if_receipt_script"
                      test -s "$deployment_contract_script"
                      test -s "$what_if_receipt_tools_dir/azure-release-input.mjs"
                      test -s "$what_if_receipt_tools_dir/azure-canary-preflight.mjs"
                      test -s "$what_if_receipt_tools_dir/core-test-runner.mjs"
                      test -s "$what_if_receipt_tools_dir/core-test-workspace.mjs"
                      test -s "$what_if_receipt_tools_dir/fileprovider-git-clean.mjs"
                      test -s "$what_if_receipt_tools_dir/child-test-environment.mjs"
                      write_failure_receipt() {
                        local status="$1"
                        (
                          set +e
                          receipt_write_status="FAILED"
                          receipt_sha256="unknown"
                          if node "$failure_receipt_script" \
                              --output "$failure_receipt" \
                              --stage "DeployCanary" \
                              --job "DeployCanaryRevision" \
                              --boundary "${failure_boundary:-bootstrap}" \
                              --exit-code "$status" \
                              --source-commit "${commit:-unknown}" \
                              --release-version "${version:-unknown}" \
                              --pipeline-run-id "${BUILD_BUILDID:-unknown}" >/dev/null 2>&1; then
                            if test -s "$failure_receipt" && jq -e '.schemaVersion == 1 and .status == "FAIL" and (.boundary | type == "string") and (.exitCode | type == "number")' "$failure_receipt" >/dev/null 2>&1; then
                              receipt_sha256="$(sha256sum "$failure_receipt" | awk '{print $1}')"
                              if [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]; then
                                printf '%s\n' "$receipt_sha256" > "$failure_receipt_sha256"
                                chmod 600 "$failure_receipt_sha256"
                                if test -s "$failure_receipt_sha256" && grep -Eq '^[0-9a-f]{64}$' "$failure_receipt_sha256"; then
                                  receipt_write_status="READY"
                                fi
                              fi
                            fi
                          fi
                          if [[ "$receipt_write_status" == READY ]]; then
                            printf '##vso[task.logissue type=warning;code=TEAMSAPP_AZURE_DEPLOYMENT_RECEIPT;]receiptWriteStatus=READY; receiptSha256=%s.\n' "$receipt_sha256"
                          else
                            printf '##vso[task.logissue type=error;code=TEAMSAPP_AZURE_DEPLOYMENT_RECEIPT;]receiptWriteStatus=FAILED; receipt artifact was not written, non-empty, schema-valid, and checksum-backed.\n'
                          fi
                          printf '##vso[task.logissue type=error;code=TEAMSAPP_AZURE_DEPLOYMENT_BOUNDARY;]boundary=%s exitCode=%s; inspect azure-deployment-failure-receipt artifact and this task stderr.\n' "${failure_boundary:-bootstrap}" "$status"
                        ) || true
                      }
                      cleanup_deployment_temp_files() {
                        rm -f "$foundation_parameters" "$workload_parameters" "$workload_what_if" "$worker_vm_inventory"
                      }
                      trap 'status=$?; if [[ "$status" -ne 0 ]]; then write_failure_receipt "$status"; fi; cleanup_deployment_temp_files; exit "$status"' EXIT
                      test "$(az account show --query id --output tsv)" = "$AZURE_SUBSCRIPTION_ID"
                      test -n "$WORKER_ADMIN_SSH_PUBLIC_KEY"
                      [[ "$CODEX_PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]
                      [[ "$CODEX_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
                      expected_codex_package_url="https://github.com/openai/codex/releases/download/rust-v${CODEX_PACKAGE_VERSION}/codex-package-x86_64-unknown-linux-musl.tar.gz"
                      test "$CODEX_PACKAGE_URL" = "$expected_codex_package_url"
                      receipt="$(Pipeline.Workspace)/validated-github-handoff/dist/evidence/azure-release-receipt.json"
                      provenance="$(Pipeline.Workspace)/validated-github-handoff/github-handoff-provenance.json"
                      platform_receipt="$(Pipeline.Workspace)/azure-platform-preflight-receipt/azure-platform-preflight-receipt.json"
                      rbac_receipt="$(Pipeline.Workspace)/azure-rbac-preflight-receipt/azure-deployment-rbac-receipt.json"
                      worker_receipt="$(Pipeline.Workspace)/azure-worker-runtime-package/worker-runtime-receipt.json"
                      foundation_what_if_receipt="$(Pipeline.Workspace)/azure-what-if-preflight-receipt/azure-what-if-preflight-receipt.json"
                      workload_what_if_receipt_dir="$(Pipeline.Workspace)/azure-what-if-workload"
                      mkdir -p "$workload_what_if_receipt_dir"
                      failure_boundary="release-receipt"
                      node scripts/azure-release-input.mjs "$receipt"
                      commit="$(jq -er '.commit' "$receipt")"
                      failure_boundary="materialize-release-source"
                      git fetch --no-tags origin "$commit" --depth=1
                      git checkout --detach "$commit"
                      worker_archive="$(Pipeline.Workspace)/azure-worker-runtime-package/worker-runtime-${commit}.tar"
                      failure_boundary="verify-preapproval-receipts"
                      node scripts/azure-worker-runtime-package.mjs verify \
                        --archive "$worker_archive" \
                        --receipt "$worker_receipt" \
                        --commit "$commit" \
                        --codex-package-sha256 "$CODEX_PACKAGE_SHA256" \
                        --codex-version "$CODEX_PACKAGE_VERSION" \
                        --expected-node-version 24.19.0 > "$(Agent.TempDirectory)/verified-worker-runtime-receipt.json"
                      worker_artifact_sha="$(jq -er '.archiveSha256' "$worker_receipt")"
                      codex_bin_sha="$(jq -er '.codexBinSha256' "$worker_receipt")"
                      test "$(jq -er '.sourceCommit' "$platform_receipt")" = "$commit"
                      test "$(jq -er '.runnerImage' "$platform_receipt")" = "ubuntu-24.04"
                      test "$(jq -er '.status' "$platform_receipt")" = "READY"
                      test "$(jq -er '.azureCorePassed' "$platform_receipt")" = "true"
                      test "$(jq -er '.workerBuildPassed' "$platform_receipt")" = "true"
                      test "$(jq -er '.workerRuntimePackaged' "$platform_receipt")" = "true"
                      test "$(jq -er '.workerRuntimeArchiveSha256' "$platform_receipt")" = "$worker_artifact_sha"
                      test "$(jq -er '.codexPackageVersion' "$platform_receipt")" = "$CODEX_PACKAGE_VERSION"
                      test "$(jq -er '.codexPackageSha256' "$platform_receipt")" = "$CODEX_PACKAGE_SHA256"
                      test "$(jq -er '.codexBinSha256' "$platform_receipt")" = "$codex_bin_sha"
                      test "$(jq -er '.status' "$rbac_receipt")" = "READY"
                      test "$(jq -er '.missingActions | length' "$rbac_receipt")" = "0"
                      version="$(jq -er '.version' "$receipt")"
                      source_image="$(jq -er '.image' "$receipt")"
                      source_digest="$(jq -er '.imageDigest' "$receipt")"
                      failure_boundary="azure-identity"
                      deployment_principal_id="$(
                        az account get-access-token --resource-type arm --subscription "$AZURE_SUBSCRIPTION_ID" --query accessToken --output tsv |
                          node scripts/azure-access-token-principal.mjs --expected-tenant "$tenantId" --expected-client "$servicePrincipalId"
                      )"
                      test -n "$GHCR_IMPORT_USERNAME"
                      test -n "$GHCR_IMPORT_TOKEN"
                      test "$(git rev-parse HEAD)" = "$commit"
                      test -z "$(git status --porcelain=v1 --untracked-files=no)"
                      failure_boundary="resolve-azure-toolchain"
                      az --version
                      az bicep version
                      if command -v bicep >/dev/null 2>&1; then
                        export BICEP_BIN="$(command -v bicep)"
                      else
                        bicep_config_dir="${AZURE_CONFIG_DIR:-$HOME/.azure}"
                        export BICEP_BIN="${bicep_config_dir}/bin/bicep"
                      fi
                      test -x "$BICEP_BIN"
                      export PATH="$PATH:$(dirname "$BICEP_BIN")"
                      "$BICEP_BIN" --version

                      failure_boundary="foundation-parameters"
                      node scripts/azure-deployment-parameters.mjs \
                        --phase foundation \
                        --release-receipt "$receipt" \
                        --workload-name "$AZURE_WORKLOAD_NAME" \
                        --location "$AZURE_LOCATION" \
                        --container-image "${source_image}@${source_digest}" \
                        --deployment-principal-id "$deployment_principal_id" \
                        --worker-admin-ssh-public-key "$WORKER_ADMIN_SSH_PUBLIC_KEY" \
                        --teams-app-id "$TEAMS_APP_ID" \
                        --teams-catalog-app-id "$TEAMS_CATALOG_APP_ID" \
                        --bot-id "$BOT_ID" \
                        --tab-domain "$TAB_DOMAIN" \
                        --client-id "$CLIENT_ID" \
                        --bot-client-id "$BOT_CLIENT_ID" \
                        --tenant-id "$TENANT_ID" \
                        --application-id-uri "$APPLICATION_ID_URI" \
                        --teams-user-auth-accepted-audiences "$TEAMS_USER_AUTH_ACCEPTED_AUDIENCES" \
                        --bot-client-secret-key-vault-secret-name "$TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME" \
                        --operator-allowlist-key-vault-secret-name "$TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME" \
                        --output "$foundation_parameters"
                      node scripts/azure-what-if-receipt.mjs verify \
                        --receipt "$foundation_what_if_receipt" \
                        --phase foundation \
                        --commit "$commit" \
                        --version "$version" \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template infra/azure/main.bicep \
                        --parameters "$foundation_parameters"
                      failure_boundary="foundation-deployment"
                      az deployment group create \
                        --name teamsapp-platform-foundation \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template-file infra/azure/main.bicep \
                        --parameters "@${foundation_parameters}" \
                        --mode Incremental \
                        --no-prompt true \
                        --validation-level Provider \
                        --only-show-errors \
                        --query properties.outputs --output json > "$(Agent.TempDirectory)/foundation-outputs.json"
                      failure_boundary="foundation-output-and-secret-metadata"
                      node scripts/azure-deployment-contract.mjs outputs "$(Agent.TempDirectory)/foundation-outputs.json" foundation > "$(Agent.TempDirectory)/foundation.json"
                      registry_name="$(jq -er '.registryName' "$(Agent.TempDirectory)/foundation.json")"
                      registry_server="$(jq -er '.registryLoginServer' "$(Agent.TempDirectory)/foundation.json")"
                      key_vault_name="$(jq -er '.keyVaultName.value' "$(Agent.TempDirectory)/foundation-outputs.json")"
                      for secret_name in \
                        "$TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME" \
                        "$TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME"; do
                        test -n "$(az keyvault secret show \
                          --vault-name "$key_vault_name" \
                          --name "$secret_name" \
                          --query id \
                          --only-show-errors \
                          --output tsv)"
                      done
                      failure_boundary="worker-vm-state"
                      worker_storage_account="$(jq -er '.workerArtifactStorageAccountName.value' "$(Agent.TempDirectory)/foundation-outputs.json")"
                      worker_artifact_container="$(jq -er '.workerArtifactContainerName.value' "$(Agent.TempDirectory)/foundation-outputs.json")"
                      worker_artifact_base_url="$(jq -er '.workerArtifactContainerUrl.value' "$(Agent.TempDirectory)/foundation-outputs.json")"
                      worker_vm_resource_id="$(jq -er '.workerVmResourceId.value' "$(Agent.TempDirectory)/foundation-outputs.json")"
                      worker_vm_name="${worker_vm_resource_id##*/}"
                      test -n "$worker_vm_name"
                      az resource list \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --name "$worker_vm_name" \
                        --resource-type Microsoft.Compute/virtualMachines \
                        --only-show-errors \
                        --output json > "$worker_vm_inventory"
                      worker_vm_state="$workload_what_if_receipt_dir/azure-worker-vm-state.json"
                      node scripts/azure-worker-vm-state.mjs \
                        --inventory "$worker_vm_inventory" \
                        --expected-resource-id "$worker_vm_resource_id" \
                        --output "$worker_vm_state"
                      initialize_worker_vm="$(jq -er '.initializeWorkerVm | if type == "boolean" then tostring else error("initializeWorkerVm must be boolean") end' "$worker_vm_state")"
                      [[ "$initialize_worker_vm" == true || "$initialize_worker_vm" == false ]]
                      worker_blob_name="${commit}/worker-runtime-${commit}.tar"
                      worker_artifact_url="${worker_artifact_base_url}/${worker_blob_name}"
                      image_tag="${commit:0:12}"
                      deployed_image="${registry_server}/teamsapp@${source_digest}"

                      failure_boundary="workload-parameters-and-what-if"
                      node scripts/azure-deployment-parameters.mjs \
                        --phase workload \
                        --release-receipt "$receipt" \
                        --workload-name "$AZURE_WORKLOAD_NAME" \
                        --location "$AZURE_LOCATION" \
                        --container-image "$deployed_image" \
                        --deployment-principal-id "$deployment_principal_id" \
                        --worker-admin-ssh-public-key "$WORKER_ADMIN_SSH_PUBLIC_KEY" \
                        --teams-app-id "$TEAMS_APP_ID" \
                        --teams-catalog-app-id "$TEAMS_CATALOG_APP_ID" \
                        --bot-id "$BOT_ID" \
                        --tab-domain "$TAB_DOMAIN" \
                        --client-id "$CLIENT_ID" \
                        --bot-client-id "$BOT_CLIENT_ID" \
                        --tenant-id "$TENANT_ID" \
                        --application-id-uri "$APPLICATION_ID_URI" \
                        --teams-user-auth-accepted-audiences "$TEAMS_USER_AUTH_ACCEPTED_AUDIENCES" \
                        --bot-client-secret-key-vault-secret-name "$TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME" \
                        --operator-allowlist-key-vault-secret-name "$TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME" \
                        --worker-artifact-url "$worker_artifact_url" \
                        --worker-artifact-sha256 "$worker_artifact_sha" \
                        --codex-bin-sha256 "$codex_bin_sha" \
                        --initialize-worker-vm "$initialize_worker_vm" \
                        --output "$workload_parameters"
                      az deployment group what-if \
                        --name teamsapp-platform-current-preflight \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template-file infra/azure/main.bicep \
                        --parameters "@${workload_parameters}" \
                        --mode Incremental \
                        --result-format FullResourcePayloads \
                        --no-pretty-print \
                        --no-prompt true \
                        --validation-level Provider \
                        --only-show-errors \
                        --output json > "$workload_what_if"
                      node "$what_if_receipt_script" diagnose \
                        --what-if "$workload_what_if" \
                        --phase workload \
                        --commit "$commit" \
                        --version "$version" \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template infra/azure/main.bicep \
                        --parameters "$workload_parameters" \
                        --output "$workload_what_if_receipt_dir/azure-what-if-workload-diagnostic.json"
                      node "$what_if_receipt_script" create \
                        --what-if "$workload_what_if" \
                        --phase workload \
                        --commit "$commit" \
                        --version "$version" \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template infra/azure/main.bicep \
                        --parameters "$workload_parameters" \
                        --output "$workload_what_if_receipt_dir/azure-what-if-workload-receipt.json"

                      failure_boundary="worker-blob"
                      node "$worker_blob_script" \
                        --account-name "$worker_storage_account" \
                        --container-name "$worker_artifact_container" \
                        --blob-name "$worker_blob_name" \
                        --archive "$worker_archive" \
                        --sha256 "$worker_artifact_sha"
                      failure_boundary="acr-import"
                      az acr import --name "$registry_name" --source "${source_image}@${source_digest}" --image "teamsapp:${image_tag}" --username "$GHCR_IMPORT_USERNAME" --password "$GHCR_IMPORT_TOKEN" --force
                      imported_digest="$(az acr repository show --name "$registry_name" --image "teamsapp:${image_tag}" --query digest --output tsv)"
                      test "$imported_digest" = "$source_digest"
                      test "$deployed_image" = "${registry_server}/teamsapp@${imported_digest}"

                      failure_boundary="workload-deployment"
                      az deployment group create \
                        --name teamsapp-platform-current \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --template-file infra/azure/main.bicep \
                        --parameters "@${workload_parameters}" \
                        --mode Incremental \
                        --no-prompt true \
                        --validation-level Provider \
                        --only-show-errors \
                        --query properties.outputs --output json > "$(Agent.TempDirectory)/deployment-outputs.json"
                      node scripts/azure-deployment-contract.mjs outputs "$(Agent.TempDirectory)/deployment-outputs.json" > "$(Agent.TempDirectory)/deployment.json"
                      test "$(jq -er '.registryName' "$(Agent.TempDirectory)/deployment.json")" = "$registry_name"
                      test "$(jq -er '.registryLoginServer' "$(Agent.TempDirectory)/deployment.json")" = "$registry_server"
                      app_name="$(jq -er '.containerAppName' "$(Agent.TempDirectory)/deployment.json")"
                      fqdn="$(jq -er '.containerAppFqdn' "$(Agent.TempDirectory)/deployment.json")"
                      failure_boundary="revision-and-health"
                      expected_revision_name="${app_name}--${commit:0:10}"
                      revision_ready="false"
                      for revision_attempt in $(seq 1 30); do
                        if az containerapp revision show \
                            --resource-group "$AZURE_RESOURCE_GROUP" \
                            --name "$app_name" \
                            --revision "$expected_revision_name" \
                            --output json > "$(Agent.TempDirectory)/revision.json" 2>"$(Agent.TempDirectory)/revision.stderr"; then
                          if jq -e \
                              --arg expected_revision "$expected_revision_name" \
                              '(.name == $expected_revision)
                              and (.properties.active == true)
                              and ((.properties.provisioningState == "Provisioned")
                                or (.properties.provisioningState == "Succeeded"))
                              and ((.properties.runningState == "Running")
                                or (.properties.runningState == "ScaledToZero" and .properties.healthState == "Healthy"))
                              and (((.properties.trafficWeight // 0) | tonumber) == 100)' \
                              "$(Agent.TempDirectory)/revision.json" >/dev/null; then
                            revision_ready="true"
                            break
                          fi
                        fi
                        sleep 10
                      done
                      if [[ "$revision_ready" != true ]]; then
                        echo "Expected release revision did not reach an accepted ready state/100%: $expected_revision_name" >&2
                        if test -s "$(Agent.TempDirectory)/revision.json"; then
                          jq -c '{name, properties: {active, provisioningState, runningState, healthState, trafficWeight, replicas}}' \
                            "$(Agent.TempDirectory)/revision.json" >&2 || true
                        fi
                        if test -s "$(Agent.TempDirectory)/revision.stderr"; then
                          sed -n '1,80p' "$(Agent.TempDirectory)/revision.stderr" >&2
                        fi
                        exit 1
                      fi
                      curl --fail --retry 12 --retry-all-errors --retry-delay 5 --output "$(Agent.TempDirectory)/health.json" "https://${fqdn}/api/health"
                      failure_boundary="worker-runtime"
                      worker_probe_script="$(node "$worker_runtime_probe_script" script \
                        --expected-commit "$commit" \
                        --expected-codex-bin-sha256 "$codex_bin_sha")"
                      set +e
                      az vm run-command invoke \
                        --subscription "$AZURE_SUBSCRIPTION_ID" \
                        --resource-group "$AZURE_RESOURCE_GROUP" \
                        --name "$worker_vm_name" \
                        --command-id RunShellScript \
                        --scripts "$worker_probe_script" \
                        --output json > "$worker_runtime_probe_response"
                      worker_probe_invoke_status=$?
                      set -e
                      test "$worker_probe_invoke_status" -eq 0 || {
                        printf 'Azure worker runtime probe invocation failed with exit code %s.\n' "$worker_probe_invoke_status" >&2
                        exit "$worker_probe_invoke_status"
                      }
                      node "$worker_runtime_probe_script" verify \
                        --input "$worker_runtime_probe_response" \
                        --expected-commit "$commit" \
                        --expected-codex-bin-sha256 "$codex_bin_sha" \
                        --output "$worker_runtime_probe_dir/azure-worker-runtime-probe.json"
                      failure_boundary="final-identity-contract"
                      node "$deployment_contract_script" verify "$receipt" "$provenance" "$(Agent.TempDirectory)/revision.json" "$(Agent.TempDirectory)/health.json" "$registry_server"
                  env:
                    AZURE_LOCATION: $(azureLocation)
                    AZURE_RESOURCE_GROUP: $(azureResourceGroup)
                    AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
                    AZURE_WORKLOAD_NAME: $(azureWorkloadName)
                    GHCR_IMPORT_USERNAME: $(githubArtifactUsername)
                    GHCR_IMPORT_TOKEN: $(githubArtifactReadToken)
                    WORKER_ADMIN_SSH_PUBLIC_KEY: $(workerAdminSshPublicKey)
                    TEAMS_APP_ID: $(TEAMS_APP_ID)
                    TEAMS_CATALOG_APP_ID: $(TEAMS_CATALOG_APP_ID)
                    BOT_ID: $(BOT_ID)
                    TAB_DOMAIN: $(TAB_DOMAIN)
                    CLIENT_ID: $(CLIENT_ID)
                    BOT_CLIENT_ID: $(BOT_CLIENT_ID)
                    TENANT_ID: $(TENANT_ID)
                    APPLICATION_ID_URI: $(APPLICATION_ID_URI)
                    TEAMS_USER_AUTH_ACCEPTED_AUDIENCES: $(TEAMS_USER_AUTH_ACCEPTED_AUDIENCES)
                    TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME: $(TEAMS_BOT_CLIENT_SECRET_KEY_VAULT_SECRET_NAME)
                    TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME: $(TEAMS_OPERATOR_ALLOWLIST_KEY_VAULT_SECRET_NAME)
                    CODEX_PACKAGE_URL: ${{ parameters.codexPackageUrl }}
                    CODEX_PACKAGE_SHA256: ${{ parameters.codexPackageSha256 }}
                    CODEX_PACKAGE_VERSION: ${{ parameters.codexPackageVersion }}
                - task: PublishPipelineArtifact@1
                  displayName: Retain verified worker runtime probe receipt
                  condition: succeeded()
                  inputs:
                    targetPath: $(Pipeline.Workspace)/azure-worker-runtime-probe
                    artifact: azure-worker-runtime-probe
                - task: PublishPipelineArtifact@1
                  displayName: Retain exact workload what-if receipt
                  condition: always()
                  inputs:
                    targetPath: $(Pipeline.Workspace)/azure-what-if-workload
                    artifact: azure-what-if-workload-receipt
                - task: PublishPipelineArtifact@1
                  displayName: Retain bounded deployment failure receipt
                  condition: failed()
                  inputs:
                    targetPath: $(Pipeline.Workspace)/azure-deployment-failure
                    artifact: azure-deployment-failure-receipt

  - stage: RollbackCanary
    displayName: Roll back the current traffic-serving revision
    dependsOn:
      - ValidateApprovalConfiguration
    condition: and(succeeded(), eq(${{ parameters.rollback }}, true))
    jobs:
      - deployment: RollbackCanaryRevision
        displayName: Activate, verify, and route to the previous revision
        pool:
          vmImage: ubuntu-24.04
        environment: ${{ parameters.azureDevOpsEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: approval-configuration-receipt
                - task: AzureCLI@2
                  displayName: Select current/previous revisions and verify post-rollback identity
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      test "$(az account show --query id --output tsv)" = "$AZURE_SUBSCRIPTION_ID"
                      az deployment group show --name teamsapp-platform-current --resource-group "$AZURE_RESOURCE_GROUP" --query properties.outputs --output json > "$(Agent.TempDirectory)/deployment-outputs.json"
                      node scripts/azure-deployment-contract.mjs outputs "$(Agent.TempDirectory)/deployment-outputs.json" > "$(Agent.TempDirectory)/deployment.json"
                      app_name="$(jq -er '.containerAppName' "$(Agent.TempDirectory)/deployment.json")"
                      registry_server="$(jq -er '.registryLoginServer' "$(Agent.TempDirectory)/deployment.json")"
                      app_fqdn="$(jq -er '.containerAppFqdn' "$(Agent.TempDirectory)/deployment.json")"
                      az containerapp revision list --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --output json > "$(Agent.TempDirectory)/revisions.json"
                      node scripts/azure-deployment-contract.mjs select-rollback "$(Agent.TempDirectory)/revisions.json" > "$(Agent.TempDirectory)/rollback.json"
                      current_revision="$(jq -er '.currentRevision' "$(Agent.TempDirectory)/rollback.json")"
                      previous_revision="$(jq -er '.previousRevision' "$(Agent.TempDirectory)/rollback.json")"
                      az containerapp revision show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision "$previous_revision" --output json > "$(Agent.TempDirectory)/previous-before.json"
                      node scripts/azure-deployment-contract.mjs revision-identity "$(Agent.TempDirectory)/previous-before.json" > "$(Agent.TempDirectory)/previous-identity.json"
                      previous_commit="$(jq -er '.commit' "$(Agent.TempDirectory)/previous-identity.json")"

                      printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ARTIFACT_USERNAME" --password-stdin
                      node scripts/azure-github-handoff.mjs "$GITHUB_REPOSITORY" "$previous_commit" "$(Agent.TempDirectory)/rollback-handoff"
                      receipt="$(Agent.TempDirectory)/rollback-handoff/dist/evidence/azure-release-receipt.json"
                      provenance="$(Agent.TempDirectory)/rollback-handoff/github-handoff-provenance.json"

                      az containerapp revision activate --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision "$previous_revision" --output none
                      az containerapp revision show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision "$previous_revision" --output json > "$(Agent.TempDirectory)/previous-active.json"
                      revision_fqdn="$(jq -er '.properties.fqdn' "$(Agent.TempDirectory)/previous-active.json")"
                      curl --fail --retry 12 --retry-all-errors --retry-delay 5 --output "$(Agent.TempDirectory)/pre-traffic-health.json" "https://${revision_fqdn}/api/health"
                      node scripts/azure-deployment-contract.mjs verify "$receipt" "$provenance" "$(Agent.TempDirectory)/previous-active.json" "$(Agent.TempDirectory)/pre-traffic-health.json" "$registry_server" pre-traffic

                      az containerapp ingress traffic set --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision-weight "${previous_revision}=100" --output none
                      az containerapp revision deactivate --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision "$current_revision" --output none
                      az containerapp revision show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app_name" --revision "$previous_revision" --output json > "$(Agent.TempDirectory)/previous-final.json"
                      curl --fail --retry 12 --retry-all-errors --retry-delay 5 --output "$(Agent.TempDirectory)/post-rollback-health.json" "https://${app_fqdn}/api/health"
                      node scripts/azure-deployment-contract.mjs verify "$receipt" "$provenance" "$(Agent.TempDirectory)/previous-final.json" "$(Agent.TempDirectory)/post-rollback-health.json" "$registry_server"
                  env:
                    AZURE_RELEASE_ALLOWED_REPOSITORIES: $(allowedGitHubRepositories)
                    AZURE_RESOURCE_GROUP: $(azureResourceGroup)
                    AZURE_SUBSCRIPTION_ID: $(azureSubscriptionId)
                    GITHUB_ARTIFACT_USERNAME: $(githubArtifactUsername)
                    GITHUB_REPOSITORY: $(githubRepository)
                    GITHUB_TOKEN: $(githubArtifactReadToken)
