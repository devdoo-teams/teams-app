        shell: 'node tools/ci-contract/capture-run.mjs step-5 {0}'
        run: |
          npm run test:a2a-official-contract-audit
          npm run test:a2a-core-contract
          npm run test:a2a-role-catalog
          npm run test:a2a-orchestrator
          npm run test:a2a-execution
          npm run test:a2a-observability
          npm run test:a2a-jsonrpc-route
          npm run test:a2a-http-scope
          npm run test:a2a-v1-list-tasks
          npm run test:a2a-index-integration
          npm run test:a2a-route
          npm run test:a2a-store
          npm run test:a2a-orchestration-identity
      - name: Verify durable lifecycle and authorization
        id: ci_original_6
        shell: 'node tools/ci-contract/capture-run.mjs step-6 {0}'
        run: |
          npm run test:a2a-independent-agent-identity
          npm run test:a2a-durable-dispatch
          npm run test:a2a-parent-lifecycle
          npm run test:a2a-admission-restart
          npm run test:a2a-deadline-cancellation
          npm run test:a2a-submission-durability
          npm run test:a2a-agent-authorization-policy
          npm run test:a2a-telemetry
      - name: Verify remote peer contracts
        id: ci_original_7
        shell: 'node tools/ci-contract/capture-run.mjs step-7 {0}'
        run: |
          npm run test:a2a-remote-client
          npm run test:a2a-remote-http-roundtrip
          npm run test:a2a-remote-agent-adapter

      - name: Finalize CI observation
        id: ci_receipt_finalize
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CI_RECEIPT_JOB_STATUS: ${{ job.status }}
          CI_RECEIPT_RESULTS: '{"step-1":{"outcome":"${{ steps.ci_original_1.outcome }}","conclusion":"${{ steps.ci_original_1.conclusion }}"},"step-2":{"outcome":"${{ steps.ci_original_2.outcome }}","conclusion":"${{ steps.ci_original_2.conclusion }}"},"step-3":{"outcome":"${{ steps.ci_original_3.outcome }}","conclusion":"${{ steps.ci_original_3.conclusion }}"},"step-4":{"outcome":"${{ steps.ci_original_4.outcome }}","conclusion":"${{ steps.ci_original_4.conclusion }}"},"step-5":{"outcome":"${{ steps.ci_original_5.outcome }}","conclusion":"${{ steps.ci_original_5.conclusion }}"},"step-6":{"outcome":"${{ steps.ci_original_6.outcome }}","conclusion":"${{ steps.ci_original_6.conclusion }}"},"step-7":{"outcome":"${{ steps.ci_original_7.outcome }}","conclusion":"${{ steps.ci_original_7.conclusion }}"}}'
        run: |
          set +e
          node tools/ci-contract/finalize-run.mjs
          capture_status=$?
          npm ci --prefix tools/ci-contract --ignore-scripts --no-audit --no-fund
          deps_status=$?
          receipt_root="${RUNNER_TEMP}/teams-ci-receipts/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          normalize_status=1
          if [ "$deps_status" -eq 0 ] && [ -f "$receipt_root/capture/producer.json" ]; then
            node tools/ci-contract/produce-receipt.mjs --capture-dir "$receipt_root/capture" --output-dir "$receipt_root/export/packet"
            normalize_status=$?
          fi
          if [ "$capture_status" -ne 0 ] || [ "$deps_status" -ne 0 ] || [ "$normalize_status" -ne 0 ]; then
            exit 1
          fi
      - name: Retain CI observation
        id: ci_receipt_upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/teams-ci-receipts/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/export/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
