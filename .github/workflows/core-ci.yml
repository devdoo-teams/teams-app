        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        id: ci_original_2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        id: ci_original_3
        shell: 'node tools/ci-contract/capture-run.mjs step-3 {0}'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the verified Core artifact before Docker packaging
        id: ci_original_4
        shell: 'node tools/ci-contract/capture-run.mjs step-4 {0}'
        run: npm run build:core
      - name: Build the exact runtime image without publishing
        id: ci_original_5
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: teams-sdk-mvp:${{ github.sha }}
          build-args: |
            TEAMS_SOURCE_COMMIT=${{ github.sha }}
      - name: Smoke the exact runtime image
        id: ci_original_6
        shell: 'node tools/ci-contract/capture-run.mjs step-6 {0}'
        env:
          IMAGE_TAG: teams-sdk-mvp:${{ github.sha }}
        run: |
          set -euo pipefail
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          bot_client_id='11111111-2222-4333-8444-555555555555'
          client_id='66666666-7777-4888-8999-000000000000'
          tenant_id='99999999-aaaa-4bbb-8ccc-dddddddddddd'
          tab_domain='runtime-smoke.example.com'
          application_id_uri="api://${tab_domain}/botid-${bot_client_id}"
          container_id="$(docker run --detach \
            --publish 3978:3978 \
            --env NODE_ENV=production \
            --env PORT=3978 \
            --env TEAMS_USE_SDK=true \
            --env TEAMS_SKIP_OUTBOUND=true \
            --env TEAMS_APP_ID=aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee \
            --env TEAMS_CATALOG_APP_ID=bbbbbbbb-cccc-4ddd-8eee-ffffffffffff \
            --env BOT_ID="$bot_client_id" \
            --env BOT_CLIENT_ID="$bot_client_id" \
            --env CLIENT_ID="$client_id" \
            --env CLIENT_SECRET=core-runtime-smoke-secret \
            --env TENANT_ID="$tenant_id" \
            --env TAB_DOMAIN="$tab_domain" \
            --env APPLICATION_ID_URI="$application_id_uri" \
            --env TEAMS_USER_AUTH_ACCEPTED_AUDIENCES="$application_id_uri" \
            "$IMAGE_TAG")"

          health_file="$(mktemp)"
          tab_file="$(mktemp)"
          asset_file="$(mktemp)"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3978/api/health >"$health_file"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'container did not become healthy within 30 seconds' >&2
              exit 1
            fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (health.ok !== true) throw new Error("container health did not report ok=true");
            if (health.environment !== "production") throw new Error("container health is not production");
            if (health.sourceCommit !== process.env.GITHUB_SHA) throw new Error(`container source identity mismatch: ${health.sourceCommit}`);
            if (health.auth !== "teams-authenticated" || health.bot !== "teams-sdk") throw new Error("container production auth/bot contract mismatch");
          ' "$health_file"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3978/tabs/home/ >"$tab_file"
          asset_path="$(sed -n 's/.*src="\([^\"]*assets\/main\.js[^\"]*\)".*/\1/p' "$tab_file" | head -n 1)"
          if [ -z "$asset_path" ]; then
            echo 'container tab did not expose a hashed main.js asset' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:3978/tabs/home/${asset_path#./}" >"$asset_file"
          test -s "$asset_file"

      - name: Finalize CI observation
        id: ci_receipt_finalize
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CI_RECEIPT_JOB_STATUS: ${{ job.status }}
          CI_RECEIPT_RESULTS: '{"step-1":{"outcome":"${{ steps.ci_original_1.outcome }}","conclusion":"${{ steps.ci_original_1.conclusion }}"},"step-2":{"outcome":"${{ steps.ci_original_2.outcome }}","conclusion":"${{ steps.ci_original_2.conclusion }}"},"step-3":{"outcome":"${{ steps.ci_original_3.outcome }}","conclusion":"${{ steps.ci_original_3.conclusion }}"},"step-4":{"outcome":"${{ steps.ci_original_4.outcome }}","conclusion":"${{ steps.ci_original_4.conclusion }}"},"step-5":{"outcome":"${{ steps.ci_original_5.outcome }}","conclusion":"${{ steps.ci_original_5.conclusion }}"},"step-6":{"outcome":"${{ steps.ci_original_6.outcome }}","conclusion":"${{ steps.ci_original_6.conclusion }}"}}'
        run: |
          set +e
          node tools/ci-contract/finalize-run.mjs
          capture_status=$?
          npm ci --prefix tools/ci-contract --ignore-scripts --no-audit --no-fund
          deps_status=$?
          receipt_root="${RUNNER_TEMP}/teams-ci-receipts/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          normalize_status=1
          if [ "$deps_status" -eq 0 ] && [ -f "$receipt_root/capture/producer.json" ]; then
            node tools/ci-contract/produce-receipt.mjs --capture-dir "$receipt_root/capture" --output-dir "$receipt_root/export/packet"
            normalize_status=$?
          fi
          if [ "$capture_status" -ne 0 ] || [ "$deps_status" -ne 0 ] || [ "$normalize_status" -ne 0 ]; then
            exit 1
          fi
      - name: Retain CI observation
        id: ci_receipt_upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/teams-ci-receipts/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/export/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  artifact:
    name: Immutable release candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [core, a2a, continuity, azure, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEAMS_SOURCE_COMMIT: ${{ github.sha }}
      TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
      TEAMS_CATALOG_APP_ID: ${{ vars.TEAMS_CATALOG_APP_ID }}
      BOT_ID: ${{ vars.BOT_ID }}
      BOT_CLIENT_ID: ${{ vars.BOT_CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      TAB_DOMAIN: ${{ vars.TAB_DOMAIN }}
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      APPLICATION_ID_URI: ${{ vars.APPLICATION_ID_URI }}
    steps:
      - name: Check out the verified commit
        id: ci_original_1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        id: ci_original_2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        id: ci_original_3
        shell: 'node tools/ci-contract/capture-run.mjs step-3 {0}'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify the exact artifact
        id: ci_original_4
        shell: 'node tools/ci-contract/capture-run.mjs step-4 {0}'
        run: |
          npm run build:core
          npm run test:core-runtime-smoke-isolation
          npm run check:deployment
          npm run validate:manifest
          npm run package:app
          npm run test:package-determinism
          npm run test:package-output-determinism
          npm run test:package-atomic
          npm run test:release-timeout
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const packagePath = 'appPackage/build/teams-sdk-mvp.zip';
          const manifest = JSON.parse(execFileSync('unzip', ['-p', packagePath, 'manifest.json'], { encoding: 'utf8' }));
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const placeholder = '$' + '{{';
          assert.equal(manifest.version, packageJson.version, 'artifact manifest version must match package version');
          assert.equal(manifest.devicePermissions?.includes('geolocation') ?? false, false, 'artifact manifest must not request removed geolocation');
          assert.equal(JSON.stringify(manifest).includes(placeholder), false, 'artifact manifest contains unresolved placeholders');
          console.log(`exact artifact manifest verified: v${manifest.version}, agent-only permissions`);
          NODE
      - name: Record release identity and checksums
        id: ci_original_5
        shell: 'node tools/ci-contract/capture-run.mjs step-5 {0}'
        run: |
          mkdir -p dist/evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const zip = fs.readFileSync('appPackage/build/teams-sdk-mvp.zip');
          const identity = {
            schema: 1,
            sourceCommit: process.env.GITHUB_SHA,
            version: pkg.version,
            teamsPackageSha256: crypto.createHash('sha256').update(zip).digest('hex'),
          };
          fs.writeFileSync('dist/evidence/release-identity.json', JSON.stringify(identity, null, 2) + '\n');
          NODE
          find dist appPackage/build -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/evidence/SHA256SUMS
      - name: Upload immutable release candidate
        id: ci_original_6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teams-core-${{ github.sha }}
          path: |
            dist/
            appPackage/build/teams-sdk-mvp.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Finalize CI observation
        id: ci_receipt_finalize
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CI_RECEIPT_JOB_STATUS: ${{ job.status }}
          CI_RECEIPT_RESULTS: '{"step-1":{"outcome":"${{ steps.ci_original_1.outcome }}","conclusion":"${{ steps.ci_original_1.conclusion }}"},"step-2":{"outcome":"${{ steps.ci_original_2.outcome }}","conclusion":"${{ steps.ci_original_2.conclusion }}"},"step-3":{"outcome":"${{ steps.ci_original_3.outcome }}","conclusion":"${{ steps.ci_original_3.conclusion }}"},"step-4":{"outcome":"${{ steps.ci_original_4.outcome }}","conclusion":"${{ steps.ci_original_4.conclusion }}"},"step-5":{"outcome":"${{ steps.ci_original_5.outcome }}","conclusion":"${{ steps.ci_original_5.conclusion }}"},"step-6":{"outcome":"${{ steps.ci_original_6.outcome }}","conclusion":"${{ steps.ci_original_6.conclusion }}"}}'
        run: |
          set +e
          node tools/ci-contract/finalize-run.mjs
          capture_status=$?
          npm ci --prefix tools/ci-contract --ignore-scripts --no-audit --no-fund
          deps_status=$?
          receipt_root="${RUNNER_TEMP}/teams-ci-receipts/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          normalize_status=1
          if [ "$deps_status" -eq 0 ] && [ -f "$receipt_root/capture/producer.json" ]; then
            node tools/ci-contract/produce-receipt.mjs --capture-dir "$receipt_root/capture" --output-dir "$receipt_root/export/packet"
            normalize_status=$?
          fi
          if [ "$capture_status" -ne 0 ] || [ "$deps_status" -ne 0 ] || [ "$normalize_status" -ne 0 ]; then
            exit 1
          fi
      - name: Retain CI observation
        id: ci_receipt_upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/teams-ci-receipts/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/export/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
