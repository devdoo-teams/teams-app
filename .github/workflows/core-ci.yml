name: Teams Core, A2A, and Continuity CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teams-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEAMS_CI_RECEIPT_MODE: observation
  NODE_VERSION: 24.19.0

jobs:
  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        id: ci_original_1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        id: ci_original_2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        id: ci_original_3
        shell: 'node tools/ci-contract/capture-run.mjs step-3 {0}'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded source checks
        id: ci_original_4
        shell: 'node tools/ci-contract/capture-run.mjs step-4 {0}'
        run: |
          npm run typecheck:core
          npm run typecheck
          npm run test:typecheck-boundary
          npm run test:core-source-check
          npm run test:ci-workflow-contract
          npm run test:docker-build-contract
          npm run test:image-publish-workflow-contract
          node scripts/release-observation-test.mjs
          node scripts/runtime-replay-startup-test.mjs
          python3 scripts/local-hub-lifetime-test.py
          npx --no-install tsx scripts/job-conversation-client-test.ts
          npx --no-install tsx scripts/job-detail-selection-test.ts
          npx --no-install tsx scripts/job-conversation-view-test.tsx
      - name: Build Core
        id: ci_original_5
        shell: 'node tools/ci-contract/capture-run.mjs step-5 {0}'
        run: npm run build:core
      - name: Run Core tests
        id: ci_original_6
        shell: 'node tools/ci-contract/capture-run.mjs step-6 {0}'
        run: npm run test:core
      - name: Validate Teams manifest
        id: ci_original_7
        shell: 'node tools/ci-contract/capture-run.mjs step-7 {0}'
        run: npm run validate:manifest
      - name: Verify deterministic Teams package
        id: ci_original_8
        shell: 'node tools/ci-contract/capture-run.mjs step-8 {0}'
        run: npm run test:package-determinism

      - name: Finalize CI observation
        id: ci_receipt_finalize
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CI_RECEIPT_JOB_STATUS: ${{ job.status }}
          CI_RECEIPT_RESULTS: '{"step-1":{"outcome":"${{ steps.ci_original_1.outcome }}","conclusion":"${{ steps.ci_original_1.conclusion }}"},"step-2":{"outcome":"${{ steps.ci_original_2.outcome }}","conclusion":"${{ steps.ci_original_2.conclusion }}"},"step-3":{"outcome":"${{ steps.ci_original_3.outcome }}","conclusion":"${{ steps.ci_original_3.conclusion }}"},"step-4":{"outcome":"${{ steps.ci_original_4.outcome }}","conclusion":"${{ steps.ci_original_4.conclusion }}"},"step-5":{"outcome":"${{ steps.ci_original_5.outcome }}","conclusion":"${{ steps.ci_original_5.conclusion }}"},"step-6":{"outcome":"${{ steps.ci_original_6.outcome }}","conclusion":"${{ steps.ci_original_6.conclusion }}"},"step-7":{"outcome":"${{ steps.ci_original_7.outcome }}","conclusion":"${{ steps.ci_original_7.conclusion }}"},"step-8":{"outcome":"${{ steps.ci_original_8.outcome }}","conclusion":"${{ steps.ci_original_8.conclusion }}"}}'
        run: |
          set +e
          node tools/ci-contract/finalize-run.mjs
          capture_status=$?
          npm ci --prefix tools/ci-contract --ignore-scripts --no-audit --no-fund
          deps_status=$?
          receipt_root="${RUNNER_TEMP}/teams-ci-receipts/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          normalize_status=1
          if [ "$deps_status" -eq 0 ] && [ -f "$receipt_root/capture/producer.json" ]; then
            node tools/ci-contract/produce-receipt.mjs --capture-dir "$receipt_root/capture" --output-dir "$receipt_root/export/packet"
            normalize_status=$?
          fi
          if [ "$capture_status" -ne 0 ] || [ "$deps_status" -ne 0 ] || [ "$normalize_status" -ne 0 ]; then
            exit 1
          fi
      - name: Retain CI observation
        id: ci_receipt_upload
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/teams-ci-receipts/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}/export/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
