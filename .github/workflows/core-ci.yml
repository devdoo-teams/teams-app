  azure:
    name: Azure Core on deployment runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        id: ci_original_1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        id: ci_original_2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        id: ci_original_3
        shell: 'node tools/ci-contract/capture-run.mjs step-3 {0}'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the complete Azure Core inventory on pinned Linux
        id: ci_original_4
        shell: 'node tools/ci-contract/capture-run.mjs step-4 {0}'
        env:
          TEAMS_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          az --version
          az bicep version
          if command -v bicep >/dev/null 2>&1; then
            export BICEP_BIN="$(command -v bicep)"
          else
            bicep_config_dir="${AZURE_CONFIG_DIR:-$HOME/.azure}"
            export BICEP_BIN="${bicep_config_dir}/bin/bicep"
          fi
          test -x "$BICEP_BIN"
          export PATH="$(dirname "$BICEP_BIN"):$PATH"
          "$BICEP_BIN" --version
          tar --version
          ruby --version
          ruby -rpsych -e 'puts "Psych #{Psych::VERSION}"'
          python3 --version
          npm run test:azure-core
          npm run build:worker

      - name: Finalize CI observation
        id: ci_receipt_finalize
        if: always()
        timeout-minutes: 5
        shell: bash
        env:
          CI_RECEIPT_JOB_STATUS: ${{ job.status }}
