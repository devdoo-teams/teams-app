name: Publish immutable Teams runtime image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish immutable runtime image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEAMS_SOURCE_COMMIT: ${{ github.sha }}
      TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
      TEAMS_CATALOG_APP_ID: ${{ vars.TEAMS_CATALOG_APP_ID }}
      BOT_ID: ${{ vars.BOT_ID }}
      BOT_CLIENT_ID: ${{ vars.BOT_CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      TAB_DOMAIN: ${{ vars.TAB_DOMAIN }}
      CLIENT_ID: ${{ vars.CLIENT_ID }}
      APPLICATION_ID_URI: ${{ vars.APPLICATION_ID_URI }}
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify the exact source before publishing
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'manual image promotion is allowed only from refs/heads/main' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "version tag $tag_version does not match package.json $package_version" >&2
              exit 1
            fi
          fi
          npm run check:deployment
          npm run typecheck:core
          npm run build:core
          npm run test:core
          npm run test:runtime-dist
          npm run validate:manifest
          npm run package:app
          npm run test:package-determinism
          npm run test:package-output-determinism
          npm run test:package-atomic

      - name: Record package and server identity before image push
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const sourceCommit = process.env.GITHUB_SHA;
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packagePath = 'appPackage/build/teams-sdk-mvp.zip';
          const packageBytes = fs.readFileSync(packagePath);
          const manifestBytes = execFileSync('unzip', ['-p', packagePath, 'manifest.json']);
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const marker = JSON.parse(fs.readFileSync('dist/server/.teams-server-build-commit', 'utf8'));
          const serverBundleBytes = fs.readFileSync('dist/server/index.js');
          const bundleSha256 = sha256(serverBundleBytes);
          const clientFiles = fs.readdirSync('dist/client', { recursive: true })
            .filter((entry) => fs.statSync(`dist/client/${entry}`).isFile())
            .sort();
          const clientBundleSha256 = sha256(Buffer.concat(clientFiles.flatMap((entry) => [
            Buffer.from(`${entry}\u0000`),
            fs.readFileSync(`dist/client/${entry}`),
          ])));
          if (
            marker.schemaVersion !== 3
            || marker.commit !== sourceCommit
            || marker.mode !== 'core'
            || marker.worktree !== 'clean'
            || marker.bundleSha256 !== bundleSha256
          ) {
            throw new Error('server build marker does not prove the exact clean Core source commit');
          }
          if (manifest.version !== packageJson.version || manifest.devicePermissions?.includes('geolocation')) {
            throw new Error('packaged manifest version or agent-only permissions are invalid');
          }
          const identity = {
            schema: 2,
            sourceCommit,
            version: packageJson.version,
            teamsPackageSha256: sha256(packageBytes),
            clientBundleSha256,
            serverBundleSha256: bundleSha256,
            manifestSha256: sha256(manifestBytes),
            imageDigest: null,
          };
          fs.writeFileSync('dist/evidence/release-identity.json', `${JSON.stringify(identity, null, 2)}\n`);
          NODE

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Build and publish the exact runtime image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TEAMS_SOURCE_COMMIT=${{ github.sha }}

      - name: Smoke the exact pushed image by immutable digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          HOST_PORT: 3978
        run: node scripts/docker-runtime-image-smoke.mjs

      - name: Bind the pushed image digest to the release identity
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const identityPath = 'dist/evidence/release-identity.json';
          const identity = JSON.parse(fs.readFileSync(identityPath, 'utf8'));
          if (!/^sha256:[0-9a-f]{64}$/.test(process.env.IMAGE_DIGEST ?? '')) {
            throw new Error('Docker did not return a valid immutable image digest');
          }
          if (identity.sourceCommit !== process.env.GITHUB_SHA) {
            throw new Error('release identity source commit changed before digest binding');
          }
          identity.image = `${process.env.REGISTRY}/${process.env.IMAGE_NAME}`;
          identity.imageDigest = process.env.IMAGE_DIGEST;
          fs.writeFileSync(identityPath, `${JSON.stringify(identity, null, 2)}\n`);
          const handoff = {
            schemaVersion: 1,
            source: 'github-actions',
            commit: identity.sourceCommit,
            version: identity.version,
            image: identity.image,
            imageDigest: identity.imageDigest,
            teamsPackageSha256: identity.teamsPackageSha256,
            clientBundleSha256: identity.clientBundleSha256,
            serverBundleSha256: identity.serverBundleSha256,
          };
          fs.writeFileSync('dist/evidence/azure-release-receipt.json', `${JSON.stringify(handoff, null, 2)}\n`);
          NODE

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the Azure release receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/evidence/azure-release-receipt.json

      - name: Attest the Teams package bound by the receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: appPackage/build/teams-sdk-mvp.zip

      - name: Upload immutable release identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teams-runtime-identity-${{ github.sha }}
          path: |
            dist/evidence/release-identity.json
            dist/evidence/azure-release-receipt.json
            appPackage/build/teams-sdk-mvp.zip
            dist/server/**
            dist/client/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
