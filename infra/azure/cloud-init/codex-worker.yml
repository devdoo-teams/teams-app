#cloud-config
# Auth material is provisioned out of band after the VM exists.
# Never copy auth.json, tokens, account keys, connection strings, or device codes here.
users:
  - name: teamsworker
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /etc/teamsapp/worker.env.example
    owner: root:teamsworker
    permissions: '0640'
    content: |
      # Non-secret resource identity/configuration only.
      AZURE_CLIENT_ID=SET_AZURE_CLIENT_ID
      AZURE_STORAGE_QUEUE_ENDPOINT=SET_AZURE_STORAGE_QUEUE_ENDPOINT
      AZURE_STORAGE_POISON_QUEUE_ENDPOINT=SET_AZURE_STORAGE_POISON_QUEUE_ENDPOINT
      TEAMS_STORAGE_BACKEND=cosmos
      AZURE_COSMOS_ENDPOINT=SET_AZURE_COSMOS_ENDPOINT
      AZURE_COSMOS_DATABASE=SET_AZURE_COSMOS_DATABASE
      AZURE_COSMOS_CONTAINER=SET_AZURE_COSMOS_CONTAINER
      AGENT_CODEX_HOME=/var/lib/teamsapp/codex-home
      CODEX_BIN=/opt/teamsapp/bin/codex
      CODEX_BIN_SHA256=SET_BY_DEPLOYMENT
      TEAMS_WORKER_COMPOSITION_MODULE=/opt/teamsapp/current/dist/worker/composition.js
  - path: /etc/systemd/system/teamsapp-worker.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=TeamsApp durable Codex worker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=teamsworker
      Group=teamsworker
      EnvironmentFile=/etc/teamsapp/worker.env
      WorkingDirectory=/opt/teamsapp/current
      ExecStart=/usr/bin/npm run start:worker
      Restart=always
      RestartSec=5
      KillMode=control-group
      TimeoutStopSec=30
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/lib/teamsapp

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [install, -d, -o, teamsworker, -g, teamsworker, -m, '0700', /var/lib/teamsapp/codex-home]
  - [install, -d, -o, root, -g, teamsworker, -m, '0750', /etc/teamsapp]
  - [install, -d, -o, root, -g, root, -m, '0755', /opt/teamsapp/bin]
  - [systemctl, daemon-reload]
  # The service is enabled only after the immutable app, verified CODEX_BIN,
  # managed-identity settings, and out-of-band worker authentication are present.
